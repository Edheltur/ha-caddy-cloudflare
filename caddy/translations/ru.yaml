configuration:
  cloudflare_api_token:
    name: API-токен Cloudflare
    description: "Токен для выбранной зоны с DNS Edit и Zone Read. В JSON оставьте подстановку {env.CF_API_TOKEN}."
  caddy_config:
    name: Конфигурация Caddy (JSON)
    description: "Для многострочного редактирования откройте меню → Редактировать в YAML и используйте caddy_config: |. Замените все ha.example.com. Внутренний порт оставьте 8443; внешний меняется в разделе «Сеть»."
  client_ca_pem:
    name: Доверенный клиентский CA (публичный PEM)
    description: "Вставьте только публичные сертификаты CA, без приватного ключа. Нужны для mTLS по умолчанию. Допустимы переносы или одна строка. Очистка удаляет созданный файл CA после перезапуска."
network:
  8443/tcp: "Внешний порт HTTPS (по умолчанию 443); внутри контейнера Caddy должен слушать 8443."
